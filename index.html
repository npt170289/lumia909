<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumia 909 - 5 UID Batch</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>body{font-family:monospace;background:#0a0a0a;color:#00ff66;padding:18px} #log{background:#000;border:1px solid #00ff66;border-radius:6px;padding:10px;white-space:pre-wrap;height:600px;overflow:auto;font-size:11px} button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px} #b1{background:#00ff66;color:#000} #b2{background:#ff00ff;color:#fff}</style>
</head>
<body>
<h2>🔥 Lumia 909 - Pay A2U 5 UID (1 click)</h2>
<p>Đã nhúng sẵn 5 UID thật của bro</p>
<button id="b1">1. ĐĂNG NHẬP PI</button>
<button id="b2">2. BẮN 1 PHÁT CHO 5 UID</button>
<div id="log">Sẵn sàng...</div>
<script>
const FIVE_UIDS = [
 "17bd5195-d292-453f-9257-e3c9d812a7a0",
 "4a0e132a-2689-484b-8d4b-04e6391a89d9",
 "7dc50a3e-e66d-4e06-8077-d2b5306889b1",
 "0c5bbb4d-5306-48b4-b227-383d95399a53",
 "f963dc03-f6f5-41ba-a3f4-54f5a8569b5c"
];
const logEl=document.getElementById('log'); let busy=false;
function log(m){logEl.textContent+="\n["+new Date().toLocaleTimeString()+"] "+m; logEl.scrollTop=logEl.scrollHeight;}
function setBusy(v){busy=v; document.querySelectorAll('button').forEach(b=>b.disabled=v);}
async function onIncompletePayment(payment){
  log("⚠️ Có payment kẹt: "+payment.identifier+" -> đang nhờ server cancel...");
  try{
    await fetch("/api/pay", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({action:"cancel_incomplete", paymentId: payment.identifier})});
  }catch{}
}
async function auth(){
  if(!window.Pi) throw new Error("Mở bằng Pi Browser");
  const a = await window.Pi.authenticate(["username","payments","wallet_address"], onIncompletePayment);
  log("Login OK: @"+a.user.username+" "+a.user.uid); return a;
}
window.addEventListener("load",()=>{try{Pi.init({version:"2.0", sandbox:true}); log("SDK OK - 5 UID: "+FIVE_UIDS.join(", ").substring(0,80)+"...");}catch(e){log(e.message);}});
document.getElementById('b1').onclick=async()=>{if(busy)return; setBusy(true); try{await auth();}catch(e){log("LỖI: "+e.message);}finally{setBusy(false);}};
document.getElementById('b2').onclick=async()=>{
 if(busy)return; setBusy(true);
 try{
  await auth();
  log("🚀 Bắn batch 5 UID - amount 1...");
  const r = await fetch("/api/pay", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ uids: FIVE_UIDS, amount: 1 })
  });
  const data = await r.json();
  log("Kết quả HTTP "+r.status+": "+JSON.stringify(data, null, 2).substring(0,3000));
  if(data.results){
    data.results.forEach((res,i)=> log( (res.success?"✅":"❌")+" ["+(i+1)+"/5] "+res.uid.substring(0,8)+"... "+(res.success?"OK":"FAIL") ));
  }
 }catch(e){log("LỖI: "+e.message);}finally{setBusy(false);}
};
</script>
</body>
</html>
