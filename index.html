<!-- LUMIA 909 - MAINNET BUILD + SANDBOX ENABLED v7 - COLLECT UID -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumia 909 - MAINNET - SANDBOX</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:monospace;background:#0a0a0a;color:#0f0;padding:15px;padding-top:50px;margin:0}
h2{margin-top:10px;font-size:18px;line-height:1.4}
h2 span.main{color:#fff;background:red;padding:3px 8px;border-radius:4px}
h2 span.test{color:#000;background:#0f0;padding:3px 8px;border-radius:4px;margin-left:5px}
button{padding:12px 18px;margin:8px 5px;font-size:15px;cursor:pointer;font-weight:bold;border-radius:6px}
#verify{border:1px dashed #ff0;background:#1a1a00;color:#ff0;padding:10px;margin:12px 0;font-size:12px;border-radius:6px;word-break:break-all}
#verify b{color:#fff}
#log{white-space:pre-wrap;background:#000;padding:12px;border:1px solid #0f0;height:420px;overflow:auto;font-size:12px;border-radius:6px}
</style>
</head>
<body>

<h2>🟣 <span class="main">MAINNET</span> Lumia 909 <span class="test">SANDBOX ENABLED</span></h2>

<p style="color:#aaa;font-size:12px;margin:5px 0">App MAINNET - Pay Pi TEST - Garden Soul</p>

<div id="verify">
<b>🔍 XÁC MINH DỰ ÁN:</b><br>
✅ BUILD: <b>lumia909.vercel.app</b><br>
✅ App ID: <b>lumia909</b> - MAINNET<br>
✅ Current URL: <span id="curUrl" style="color:#0ff">đang tải...</span><br>
✅ Host: <span id="curHost" style="color:#0ff"></span>
</div>

<button onclick="hardResetSandbox()" style="background:#ffeb3b;color:#000">0. 🔄 RESET SANDBOX</button>
<button id="btnLogin" style="background:#0f0;color:#000">1. ĐĂNG NHẬP PI (LẤY UID)</button>
<button id="btnPay" style="background:#ff00ff;color:#fff">2. BẮN 5 UID</button>

<div id="log">[LOG] Ready for Lumia909 - Thu thập UID Sandbox...</div>

<script>
const Pi=window.Pi;
Pi.init({version:"2.0", sandbox:true});

document.getElementById('curUrl').textContent = window.location.href;
document.getElementById('curHost').textContent = window.location.hostname;

let TARGET_UIDS=[
  {username:"tam_thoi_1", uid:"chua_co_1"},
  {username:"tam_thoi_2", uid:"chua_co_2"},
  {username:"tam_thoi_3", uid:"chua_co_3"},
  {username:"tam_thoi_4", uid:"chua_co_4"},
  {username:"tam_thoi_5", uid:"chua_co_5"}
];

function addLog(m){
  let el=document.getElementById('log');
  el.textContent+="\n["+new Date().toLocaleTimeString()+"] "+m;
  el.scrollTop=el.scrollHeight;
  console.log(m);
}

function hardResetSandbox(){
  addLog("🧹 Đang xóa cache...");
  try{
    localStorage.clear();
    sessionStorage.clear();
    if(window.indexedDB && window.indexedDB.databases){
      window.indexedDB.databases().then(dbs=>{dbs.forEach(db=>{window.indexedDB.deleteDatabase(db.name)})});
    }
  }catch(e){ addLog("⚠️ Lỗi xóa: "+e.message); }
  setTimeout(()=>{
    window.location.href = window.location.pathname + '?clear_sandbox=' + Date.now();
  }, 700);
}

document.getElementById('btnLogin').onclick=async()=>{
  try{
    addLog("🔄 Đang xác thực Pi Account...");
    let auth=await Pi.authenticate(['username','payments'],(p)=>{addLog("Incomplete: "+p.identifier)});
    addLog("----------------------------------------");
    addLog("✅ ĐĂNG NHẬP THÀNH CÔNG!");
    addLog("👉 USERNAME: " + auth.user.username);
    addLog("👉 UID CHUẨN: " + auth.user.uid);
    addLog("----------------------------------------");
  }catch(e){addLog("❌ LỖI LOGIN: "+e.message)}
};

document.getElementById('btnPay').onclick=async()=>{
  addLog("🚀 BẮT ĐẦU BẮN UID...");
  for(let i=0;i<TARGET_UIDS.length;i++){
    let u=TARGET_UIDS[i];
    addLog(`⏳ [${i+1}/5] @${u.username} (${u.uid.substring(0,8)}...)`);
    try{
      let r=await fetch('/api/a2u?cache_bust='+Date.now(),{
        method:'POST',
        headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},
        body:JSON.stringify({uid:u.uid,username:u.username,amount:1,memo:`Lumia909 Mainnet to @${u.username} #${Date.now()}`})
      });
      let res=await r.json();
      if(r.ok) addLog(`✅ [${i+1}/5] @${u.username} THÀNH CÔNG! ${JSON.stringify(res).substring(0,200)}`);
      else addLog(`❌ [${i+1}/5] THẤT BẠI: ${JSON.stringify(res).substring(0,300)}`);
    }catch(err){addLog(`❌ Lỗi mạng: ${err.message}`)}
    await new Promise(r=>setTimeout(r,1200));
  }
};
</script>
</body>
</html>
