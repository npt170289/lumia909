<!-- LUMIA 909 - MAINNET BUILD + SANDBOX ENABLED v9 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumia 909 - MAINNET - SANDBOX</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:monospace;background:#0a0a0a;color:#0f0;padding:15px;padding-top:50px;margin:0}
h2{margin-top:10px;font-size:18px;line-height:1.4}
h2 span.main{color:#fff;background:red;padding:3px 8px;border-radius:4px}
h2 span.test{color:#000;background:#0f0;padding:3px 8px;border-radius:4px;margin-left:5px}
button{padding:12px 18px;margin:8px 5px;font-size:15px;cursor:pointer;font-weight:bold;border-radius:6px}
#verify{border:1px dashed #ff0;background:#1a1a00;color:#ff0;padding:10px;margin:12px 0;font-size:12px;border-radius:6px;word-break:break-all}
#verify b{color:#fff}
#log{white-space:pre-wrap;background:#000;padding:12px;border:1px solid #0f0;height:420px;overflow:auto;font-size:12px;border-radius:6px}
</style>
</head>
<body>

<h2>🚀 <span class="main">MAINNET</span> Lumia 909 <span class="test">SANDBOX ENABLED</span></h2>

<p style="color:#aaa;font-size:12px;margin:5px 0">App MAINNET - Pay Pi TEST - 5 UID Chuẩn</p>

<div id="verify">
<b>🔍 XÁC MINH DỰ ÁN:</b><br>
✅ App ID: <b>lumia909</b> (MAINNET)<br>
✅ Build: <b>lumia909.vercel.app</b><br>
✅ Mode: <b id="modeText">SANDBOX = Pay Pi TEST (PCT yêu cầu)</b><br>
✅ Current URL: <span id="curUrl" style="color:#0ff">đang tải...</span><br>
✅ Host: <span id="curHost" style="color:#0ff"></span>
</div>

<button id="btnLogin" style="background:#0f0;color:#000">1. ĐĂNG NHẬP PI (SANDBOX)</button>
<button id="btnPay" style="background:#ff00ff;color:#fff">2. BẮN 5 UID MAINNET (TEST PAY)</button>

<div id="log">Sẵn sàng MAINNET - Đang ở chế độ SANDBOX (Pay Pi Test)...</div>

<script>
const Pi=window.Pi;
Pi.init({version:"2.0", sandbox:true});

document.getElementById('curUrl').textContent = window.location.href;
document.getElementById('curHost').textContent = window.location.hostname;

const TARGET_UIDS=[
  {username:"user_1", uid:"17bd5195-d292-453f-9257-e3c9d812a7a0"},
  {username:"user_2", uid:"4a0e132a-2689-484b-8d4b-04e6391a89d9"},
  {username:"user_3", uid:"7dc50a3e-e66d-4e06-8077-d2b5306889b1"},
  {username:"user_4", uid:"0c5bbb4d-5306-48b4-b227-383d95399a53"},
  {username:"user_5", uid:"f963dc03-f6f5-41ba-a3f4-54f5a8569b5c"}
];

function addLog(m){
  let el=document.getElementById('log');
  el.textContent+="\n["+new Date().toLocaleTimeString()+"] "+m;
  el.scrollTop=el.scrollHeight;
}

document.getElementById('btnLogin').onclick=async()=>{
  try{
    addLog("🔄 Xác thực Pi SANDBOX cho App MAINNET: "+window.location.hostname);
    let auth=await Pi.authenticate(['username','payments'],(p)=>{addLog("Incomplete: "+p.identifier)});
    addLog("✅ LOGIN SANDBOX (cho App MAINNET): "+auth.user.uid+" @"+auth.user.username);
  }catch(e){addLog("❌ LỖI: "+e.message)}
};

document.getElementById('btnPay').onclick=async()=>{
  addLog("🚀 BẮT ĐẦU BẮN 5 UID MAINNET - DOMAIN: "+window.location.hostname+" - PAY TEST...");
  for(let i=0;i<TARGET_UIDS.length;i++){
    let u=TARGET_UIDS[i];
    addLog(`⏳ [${i+1}/5] (${u.uid.substring(0,8)}...)`);
    try{
      let r=await fetch('/api/a2u',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({uid:u.uid,username:u.username,amount:1})
      });
      let res=await r.json();
      if(r.ok) addLog(`✅ [${i+1}/5] THÀNH CÔNG MAINNET TEST PAY! PaymentID: ${res.paymentId || JSON.stringify(res)}`);
      else addLog(`❌ [${i+1}/5] THẤT BẠI: ${JSON.stringify(res)}`);
    }catch(err){addLog(`❌ Lỗi mạng: ${err.message}`)}
    await new Promise(r=>setTimeout(r,1200));
  }
  addLog("🎉 XONG BATCH MAINNET - SANDBOX PAY TEST! Domain: "+window.location.hostname);
};
</script>
</body>
</html>
