<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumia 909 - A2U Single Template</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: monospace; background: #0a0a0a; color: #00ff66; padding: 20px; margin: 0; }
    h2 { line-height: 1.5; }
    .tag { background: #00ff66; color: #000; padding: 3px 7px; border-radius: 4px; }
    #verify, #log { background: #000; border: 1px solid #00ff66; border-radius: 6px; padding: 12px; margin: 12px 0; overflow-wrap: anywhere; }
    #log { white-space: pre-wrap; height: 350px; overflow-y: auto; font-size: 12px; }
    button { width: 100%; padding: 13px; margin: 8px 0; border: 0; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #btnReset { background: #ffeb3b; color: #000; }
    #btnLogin { background: #00ff66; color: #000; }
    #btnPay { background: #ff00ff; color: #fff; }
  </style>
</head>
<body>
  <h2><span class="tag">TESTNET</span> Lumia 909 A2U Template</h2>
  <p>Pi Sandbox — Single Recipient Template (UID 2)</p>

  <div id="verify">
    <b>App:</b> lumia909<br>
    <b>Host:</b> <span id="host"></span><br>
    <b>URL:</b> <span id="url"></span>
  </div>

  <button id="btnReset">0. 🧹 TẨY TRẮNG SÂU & RESET SANDBOX</button>
  <button id="btnLogin">1. ĐĂNG NHẬP / XIN CẤP SCOPE</button>
  <button id="btnPay">2. GỬI A2U CHO UID THỨ 2</button>

  <div id="log">Sẵn sàng mẫu template UID thứ 2...</div>

  <script>
    // Cấu hình UID thứ 2 chính xác theo yêu cầu
    const TARGET = {
      username: "Test_User_2",
      uid: "4a0e132a-2689-484b-8d4b-04e6391a89d9"
    };

    const logElement = document.getElementById("log");
    const resetButton = document.getElementById("btnReset");
    const loginButton = document.getElementById("btnLogin");
    const payButton = document.getElementById("btnPay");

    let currentUser = null;
    let busy = false;

    document.getElementById("host").textContent = window.location.hostname;
    document.getElementById("url").textContent = window.location.href;

    function log(message) {
      logElement.textContent += "\n[" + new Date().toLocaleTimeString() + "] " + message;
      logElement.scrollTop = logElement.scrollHeight;
    }

    function setBusy(value) {
      busy = value;
      resetButton.disabled = value;
      loginButton.disabled = value;
      payButton.disabled = value;
    }

    // Hàm tẩy trắng sâu 4 tầng bộ nhớ của Pi Browser (Local, IndexedDB, ServiceWorker, Caches)
    async function deepCleanPiSandbox() {
      log("🧹 Đang thực hiện tẩy trắng sâu hệ thống Sandbox...");
      try {
        localStorage.clear();
        sessionStorage.clear();

        if (window.indexedDB && window.indexedDB.databases) {
          const dbs = await window.indexedDB.databases();
          for (let db of dbs) {
            if (db.name) {
              window.indexedDB.deleteDatabase(db.name);
              log("🗑️ Đã xóa IndexedDB: " + db.name);
            }
          }
        }

        document.cookie.split(";").forEach(function(c) { 
          document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
        });

        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for(let reg of regs) { 
            await reg.unregister(); 
            log("🗑️ Đã gỡ Service Worker");
          }
        }

        if (window.caches) {
          const keys = await window.caches.keys();
          for (let key of keys) {
            await window.caches.delete(key);
            log("🗑️ Đã xóa Cache Storage: " + key);
          }
        }

        log("✅ Tẩy trắng sâu hoàn tất!");
      } catch (e) {
        log("⚠ Cảnh báo dọn storage: " + e.message);
      }
    }

    async function authenticate() {
      if (!window.Pi) throw new Error("Không tìm thấy Pi SDK.");
      log("Đang xác thực và yêu cầu scope (username, payments, wallet_address)...");

      const auth = await window.Pi.authenticate(
        ["username", "payments", "wallet_address"],
        function (payment) {
          log("⚠ Phát hiện payment chưa hoàn tất: " + (payment?.identifier || "không rõ"));
        }
      );

      if (!auth || !auth.user || !auth.user.uid) throw new Error("Không lấy được UID.");
      currentUser = auth.user;
      log("Đăng nhập thành công: @" + (currentUser.username || "(không có)"));
      return auth;
    }

    window.addEventListener("load", function () {
      if (!window.Pi) return;
      try {
        window.Pi.init({ version: "2.0", sandbox: true });
        log("Pi SDK đã khởi tạo.");
      } catch (error) {
        log("Lỗi khởi tạo SDK: " + error.message);
      }
    });

    resetButton.addEventListener("click", async function () {
      if (busy) return;
      setBusy(true);
      await deepCleanPiSandbox();
      setTimeout(() => {
        window.location.href = window.location.protocol + "//" + window.location.host + window.location.pathname + "?reset=" + Date.now();
      }, 1000);
    });

    loginButton.addEventListener("click", async function () {
      if (busy) return;
      setBusy(true);
      try {
        await deepCleanPiSandbox();
        await authenticate();
      } catch (error) {
        log("LỖI ĐĂNG NHẬP: " + error.message);
      } finally {
        setBusy(false);
      }
    });

    payButton.addEventListener("click", async function () {
      if (busy) return;
      setBusy(true);

      try {
        // Tự động dọn sâu và xác thực lại trước khi bắn request để đảm bảo session mới tinh
        await deepCleanPiSandbox();
        await authenticate();

        log("--------------------------------");
        log("Người gửi: @" + (currentUser.username || "(không có)"));
        log("UID đích (Thứ 2): " + TARGET.username + " (" + TARGET.uid + ")");
        log("Đang gửi yêu cầu A2U tới /api/a2u...");

        const response = await fetch("/api/a2u", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            uid: TARGET.uid,
            username: TARGET.username,
            amount: 1
          })
        });

        const raw = await response.text();
        let data;
        try { data = JSON.parse(raw); } catch { data = { raw_response: raw }; }

        log("HTTP status: " + response.status);
        log("Phản hồi server: " + JSON.stringify(data, null, 2));

        if (!response.ok) {
          log("❌ YÊU CẦU THẤT BẠI");
        } else {
          log("✅ THÀNH CÔNG! Pi API đã chấp nhận yêu cầu A2U cho UID thứ 2.");
        }
      } catch (error) {
        log("LỖI: " + error.message);
      } finally {
        setBusy(false);
      }
    });
  </script>
</body>
</html>
